name: heartbeat
on:
  schedule:
    - cron: "0 1,5,9,13 * * *"
  workflow_dispatch:
concurrency:
  group: heartbeat
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python heartbeat.py
      - run: |
          git config user.name "deepred"
          git config user.email "deepred@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add heartbeat.json
          git commit -m "heartbeat" || exit 0
          git push
